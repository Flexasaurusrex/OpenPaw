services:
  - type: web
    name: openpaw-live
    runtime: node
    buildCommand: echo "Using pre-built dist"
    startCommand: cp -r extensions src/ 2>/dev/null || true && npx openpaw config set gateway.mode local && npx openpaw doctor --fix && node --max-old-space-size=1024 dist/entry.js gateway run --bind lan --port $PORT --allow-unconfigured
    envVars:
      - key: NODE_ENV
        value: production
