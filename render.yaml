services:
  - type: web
    name: openpaw-live
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm build
    startCommand: |
      export OPENPAW_WORKSPACE="/opt/render/.openpaw/workspace"
      if [ ! -d "$OPENPAW_WORKSPACE/.git" ]; then
        echo "Cloning workspace..."
        git clone https://github.com/Flexasaurusrex/openpaw-workspace.git "$OPENPAW_WORKSPACE" || true
      fi
      pnpm openpaw gateway run --bind lan --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        value: 8640799454:AAFcVJC-23NBVcyI57TVCPaShgT1x8udvow
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
