services:
  - type: web
    name: openpaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENPAW_STATE_DIR
        value: /data/.openpaw
      - key: OPENPAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENPAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openpaw-data
      mountPath: /data
      sizeGB: 1
