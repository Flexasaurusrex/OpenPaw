services:
  - type: web
    name: openpaw-live
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm build && pnpm openpaw config set gateway.mode local && pnpm openpaw config set channels.telegram.enabled true && pnpm openpaw plugins enable telegram
    startCommand: bash start-render.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        value: 8640799454:AAFcVJC-23NBVcyI57TVCPaShgT1x8udvow
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
