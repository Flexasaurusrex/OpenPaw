services:
  openpaw-gateway:
    image: ${OPENPAW_IMAGE:-openpaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENPAW_GATEWAY_TOKEN: ${OPENPAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENPAW_CONFIG_DIR}:/home/node/.openpaw
      - ${OPENPAW_WORKSPACE_DIR}:/home/node/.openpaw/workspace
    ports:
      - "${OPENPAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENPAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENPAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openpaw-cli:
    image: ${OPENPAW_IMAGE:-openpaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENPAW_GATEWAY_TOKEN: ${OPENPAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENPAW_CONFIG_DIR}:/home/node/.openpaw
      - ${OPENPAW_WORKSPACE_DIR}:/home/node/.openpaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
